name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Pure-GDScript reference-sim gate. Runs without the native extension built
  # (Godot logs a "library not found" error for the .gdextension and continues;
  # the GDScript reference sim is fully runnable on its own — design_m5.md §2.5).
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.7-stable-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.7-stable_linux.x86_64 ~/godot-bin/godot

      - name: Import project
        # Generates .godot/ (including the global class cache that class_name
        # resolution needs). Import may exit non-zero on a headless runner
        # even when the cache is fine; the test step is the real gate.
        run: ~/godot-bin/godot --headless --path . --import || true

      - name: Determinism check
        run: ~/godot-bin/godot --headless --path . -s res://tests/determinism_check.gd

      - name: Pathing check
        run: ~/godot-bin/godot --headless --path . -s res://tests/pathing_check.gd

      - name: Proc RNG check
        run: ~/godot-bin/godot --headless --path . -s res://tests/proc_rng_check.gd

      - name: Catalog check
        run: ~/godot-bin/godot --headless --path . -s res://tests/catalog_check.gd

      - name: Economy check
        run: ~/godot-bin/godot --headless --path . -s res://tests/economy_check.gd

      - name: Placement check
        run: ~/godot-bin/godot --headless --path . -s res://tests/placement_check.gd

      - name: Perf check
        run: ~/godot-bin/godot --headless --path . -s res://tests/perf_check.gd

      - name: UI catalog check
        run: ~/godot-bin/godot --headless --path . -s res://tests/ui_catalog_check.gd

  # Native (C++ GDExtension) sim build + bit-exact parity gate (design_m5.md
  # §2.5, §7). Builds the extension for desktop Linux and runs the substrate
  # and tick-0 parity checks against the frozen GDScript oracle.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install SCons
        run: pipx install scons || pip install --user scons

      - name: Cache godot-cpp build
        uses: actions/cache@v4
        with:
          path: native/godot-cpp/bin
          key: godot-cpp-${{ hashFiles('.gitmodules') }}-${{ hashFiles('native/godot-cpp/SConstruct') }}

      - name: Build native sim (template_debug)
        run: cd native && scons -j$(nproc) target=template_debug

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.7-stable-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip /tmp/godot.zip -d /tmp
          mv /tmp/Godot_v4.7-stable_linux.x86_64 ~/godot-bin/godot

      - name: Import project
        run: ~/godot-bin/godot --headless --path . --import || true

      - name: Native substrate parity
        run: ~/godot-bin/godot --headless --path . -s res://tests/native_substrate_check.gd

      - name: Native tick-0 parity
        run: ~/godot-bin/godot --headless --path . -s res://tests/native_tick0_parity_check.gd

      - name: Native per-tick parity (full M4 suite)
        run: ~/godot-bin/godot --headless --path . -s res://tests/port_parity_check.gd

      - name: Native view-API parity
        run: ~/godot-bin/godot --headless --path . -s res://tests/native_view_api_check.gd

      - name: GameSim adapter parity
        run: ~/godot-bin/godot --headless --path . -s res://tests/game_sim_check.gd

      - name: Game-loop swap (native-backed == GDScript)
        run: ~/godot-bin/godot --headless --path . -s res://tests/game_loop_smoke.gd

  # TODO (design_m5.md §2.5, §7 native_build_check / exit criterion 2): an
  # Android (arm64) build job once the NDK is provisioned in CI —
  #   cd native && scons platform=android arch=arm64 target=template_release
  # The SConstruct already supports the target; this is a CI-provisioning task.
